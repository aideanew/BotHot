name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # 工作流文件静态检查：GitHub 把加载期错误表现为「0 job、created==updated 秒红」且
  # API 不带任何错误详情——security.yml 首跑三连红（job env 用了 runner.temp/coalesce，
  # 均不在该层白名单）全靠本地 actionlint 才定位。此 job 让同类问题在 PR 期就红。
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint (pinned)
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash | bash -s -- 1.7.12 ./
          sudo mv ./actionlint /usr/local/bin/actionlint
      - name: actionlint (all workflows)
        run: actionlint

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # W5（2026-09-30）CI 真实化：此前本 job 无 postgres service——backend/tests/conftest.py:36
    # 的默认 DSN 指向 localhost:5433，:98-99 在 PG 不可达 3 秒内 skip 全部连库用例。
    # 于是 CI 里 62 个 db_session 用例无一执行，「测试通过」是静默 skip 的假象。
    # 补 service 后连库用例真实运行；再由下方 skip 门禁锁死回归。
    # 端口/凭据与 conftest 默认 DSN 逐字对齐：user bothot / pass bothot / db bothot / 宿主 5433。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bothot
          POSTGRES_PASSWORD: bothot
          POSTGRES_DB: bothot
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bothot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 迁移目标库与测试库同一份（alembic.ini 默认 DSN 亦指向 localhost:5433/bothot）。
      # AIDEANBOT_TEST_PG_DSN 显式设定，使 conftest 不再走「回退默认生产库 + D23 告警」路径。
      DATABASE_URL: postgresql+psycopg://bothot:bothot@localhost:5433/bothot
      AIDEANBOT_TEST_PG_DSN: postgresql+psycopg://bothot:bothot@localhost:5433/bothot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" pytest-cov
      # §六十一：工具链指纹落盘。backend 的 ruff/mypy 在 pyproject 的 dev extras 里
      # 钉死精确版本（实测 ruff 0.12.x 与 0.16.x 的 I001 规则互斥，一方的自动修复
      # 即为另一方的违规），指纹让「CI 实际装到了什么版本」在失败时可追溯，
      # 与 frontend 的 parity assert 对称
      - name: Tool fingerprint
        run: |
          echo "python=$(python -V 2>&1) ruff=$(ruff --version) mypy=$(mypy --version)"
      - name: Lint (ruff)
        run: ruff check app tests
      # N12（T1.5.4，2026-09-22）：补 mypy 静态门禁——此前 CI 是本地门禁脱机子集（本地口径
      # mypy 56 files 全绿，CI 却零机检）；PG 连库用例在 CI 无 PG 时按既有口径自动 skip
      - name: Type check (mypy)
        run: mypy app
      # W5：结构迁移。conftest 模块头明确「PG 夹具连真实本地 PG:5433（迁移已应用）」——
      # 此前迁移只在宿主按部署手册手工跑过，CI 从无 schema，这是连库用例必然 skip 的另一半前提。
      - name: Migrate schema (alembic upgrade head)
        run: python -m alembic upgrade head
      # WD（2026-09-30）：alembic **单头**断言。
      # 为什么必须锁：`alembic upgrade head` 在存在多个 head（分叉迁移）时行为未定义——
      # 只会应用其中一个分支，另一支**静默不落库**，而 exit code 仍为 0。
      # 本仓库刚经历 W1-W5 五路并行（各自新增迁移 ab1004w1a / w2a / w3a），
      # 分叉是这类并行最典型的产物，故把「head 数 == 1」显式前置为门禁。
      # 修复方式：`alembic merge -m "merge heads" <h1> <h2>` 后提交合并迁移。
      - name: Assert single alembic head
        run: |
          heads="$(python -m alembic heads)"
          echo "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)')"
          if [ "$count" -ne 1 ]; then
            echo "❌ 检测到 ${count} 个 alembic head（预期 1）——存在 multi-head 分叉迁移"
            echo "   修复：alembic merge -m \"merge heads\" <head1> <head2> 并提交"
            exit 1
          fi
          echo "✅ 单一 alembic head"
      # W5：skip 门禁。解析 junitxml 的 skipped 用例，两条判据：
      #   1) 「PG 不可达」类 skip 一律判失败——直接锁死本 job 要防的那类静默回归；
      #   2) skip 总数 > 基线阈值 SKIP_BASELINE 判失败。
      # 基线口径：CI 无 Redis / LangBot / 外部 API Key，故有少量**合法** skip。
      # 实测（2026-09-30，W1-W5 合并后 / HEAD 干净树 + 隔离 PG + 模拟无 Redis/无 LangBot）：
      #   `796 passed, 4 skipped`——4 条为 test_chat_sse 的真实冒烟 2 条 +
      #   test_session_store_redis 的 2 条（依赖缺失时按设计 skip）；**PG 不可达类 skip = 0**。
      # WD 复核（2026-09-30）：合并后连库用例由 742→796 增了 54 条，但 skip 数**未随之增长**——
      #   新增用例全部真实连库执行。故 4 条 skip 与用例规模无关，只与「LangBot/Redis 不可达」同源。
      #   → 阈值维持 6（实测 4 + 2 容差）：收紧到 4 会把「本地/CI 依赖可达性差异」误判为回归，
      #     而该门禁的首要职责是锁死「PG 不可达导致的静默 skip」，不是追求 skip 数最小。
      # ⚠️ 首次 CI 运行后复核：若 CI 侧 skip 数 ≠ 4，须先定位是依赖差异还是真实回归，再调阈值。
      - name: Tests (pytest) + coverage + skip gate
        env:
          SKIP_BASELINE: "6"
          # 覆盖率基线 = 实测值（2026-09-30 隔离 PG 全量跑 TOTAL=77%）下浮 2pt 防波动；
          # 提升覆盖率时应同步上调此基线
          COV_BASELINE: "75"
        shell: bash
        run: |
          set -o pipefail
          pytest tests/ -q -rs --junitxml=pytest-report.xml --cov=app --cov-report=term-missing --cov-fail-under="$COV_BASELINE" 2>&1 | tee pytest-output.log
          pytest_status=${PIPESTATUS[0]}
          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          baseline = int(os.environ.get("SKIP_BASELINE", "0"))
          try:
              root = ET.parse("pytest-report.xml").getroot()
          except Exception as exc:
              print(f"❌ skip 门禁：无法解析 pytest-report.xml（{exc}）")
              sys.exit(2)

          skips = []
          for case in root.iter("testcase"):
              skipped = case.find("skipped")
              if skipped is not None:
                  skips.append((case.get("classname", ""), skipped.get("message", "") or ""))

          total = len(skips)
          pg_skips = [s for s in skips if "PG" in s[1] and "不可达" in s[1]]
          print(f"skip 门禁：total_skipped={total} baseline={baseline} pg_unreachable={len(pg_skips)}")
          for classname, message in pg_skips[:20]:
              print(f"  PG-skip [{classname}] {message}")

          violations = []
          if pg_skips:
              violations.append(
                  f"{len(pg_skips)} 个连库用例因 PG 不可达被 skip（service 或迁移未生效）"
              )
          if total > baseline:
              violations.append(f"skip 总数 {total} 超过基线 {baseline}")

          if violations:
              for item in violations:
                  print(f"❌ {item}")
              sys.exit(1)
          print("✅ skip 门禁通过：连库用例真实执行，skip 数在基线内")
          PY
          gate_status=$?
          echo "pytest_status=${pytest_status} gate_status=${gate_status}"
          if [ "$pytest_status" -ne 0 ]; then
            exit "$pytest_status"
          fi
          exit "$gate_status"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # N12：包管理器锁一 pnpm（仓库纪律为 pnpm-lock.yaml；此前 npm install 与
      # package-lock.json 双轨漂移，2026-09-22 收敛单轨）
      # N12b（2026-09-28）：Node 20 → 24。依据：vitest@5.0.0 声明
      # `^22.12.0 || ^24.0.0 || >=26.0.0`、jsdom 声明 `^22.22.2 || ^24.15.0 || >=26.0.0`，
      # Node 20 全不满足——CI 长期在「声明不支持」的运行时上跑测试，是同类问题
      # 反复出现的机制性根源。锁精确补丁号，杜绝大版本浮标漂移。
      #
      # §六十一（N12d）**此处两次更正，顺序与解析方式都改过，保留痕迹**：
      # 更正一（已作废）：N12b 原写「pnpm 版本改为读 frontend/package.json 的
      #   packageManager，此处不再传 version」——从未生效：`defaults.run.working-directory`
      #   只作用于 `run:` 步骤、**不作用于 `uses:` action**，`pnpm/action-setup` 在仓库根执行
      #   而根目录没有 package.json（monorepo）→ "No pnpm version is specified"。
      #   当时改为「setup-node 在前 + node 解析 + 显式 version」，方向对但**顺序错**。
      # 更正二（现行）：`actions/setup-node` 的 `cache: pnpm` 会 shell out 找 pnpm，
      #   pnpm 未装时直接报 "Unable to locate executable file: pnpm"。故
      #   **pnpm/action-setup 必须在 setup-node 之前**——pnpm 二进制先落盘，
      #   node 紧随其后，任何 `pnpm` 调用都排在两者之后（见下方 parity assert 的位置）。
      #   代价：解析版本时 node 未必已在 PATH，故用 sed 而非 node 解析；
      #   并统一用 `$GITHUB_WORKSPACE` 锚定路径（本事故的教训就是 cwd 假设失效）。
      - name: Resolve pnpm version from packageManager
        id: pnpm
        shell: bash
        run: |
          pm=$(grep -m1 '"packageManager"' "$GITHUB_WORKSPACE/frontend/package.json" \
            | sed -E 's/.*"packageManager"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/' || true)
          case "$pm" in
            pnpm@[0-9]*\.[0-9]*\.[0-9]*)
              echo "packageManager=$pm"
              echo "version=${pm#pnpm@}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "❌ packageManager 必须写成 pnpm@<精确版本>，实际：'${pm:-<缺失>}'"
              echo "   隐式/范围/别名版本会让 pnpm/action-setup 静默漂移，先修再提交"
              exit 1
              ;;
          esac
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm.outputs.version }}
          # 显式 false：安装由下方 `pnpm install --frozen-lockfile` 负责，
          # 不让 action 自带 install 绕过 frozen-lockfile
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # §六十一：运行时指纹从「打印」升级为「断言」——声明值与实际值不一致时以可读错误
      # 立即失败，而不是把含糊错误留给付下游 action（本次故障的报错即如此）。
      # 位置刻意排在两个 setup action 之后：它同时调 node 与 pnpm，两者须都已就位
      - name: Runtime fingerprint & parity assert
        shell: bash
        run: |
          echo "node=$(node -v) pnpm=$(pnpm -v) tz=$(date +%Z) os=$(uname -sr)"
          exp_node=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/frontend/.nvmrc")
          act_node=$(node -v | sed 's/^v//')
          exp_pnpm=${{ steps.pnpm.outputs.version }}
          act_pnpm=$(pnpm -v)
          [ "$act_node" = "$exp_node" ] || {
            echo "❌ node 版本漂移：.nvmrc=$exp_node 实际=$act_node"; exit 1; }
          [ "$act_pnpm" = "$exp_pnpm" ] || {
            echo "❌ pnpm 版本漂移：packageManager=$exp_pnpm 实际=$act_pnpm"; exit 1; }
          echo "✅ 运行时与声明一致：node=$act_node pnpm=$act_pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      # W10：tsc --noEmit 严格门禁
      # 依赖 W9 落地，若 W9 未落地则 continue-on-error
      - name: TypeScript strict check (tsc --noEmit)
        continue-on-error: true
        run: pnpm exec tsc --noEmit
      # N12：补 vitest 单测门禁——此前 89 用例仅本地机检
      # N12b（2026-09-28）：加 --retry=2。t0263 的 findBy* 后立即断言 mock 调用存在
      # 微任务竞态（详见 frontend/tests/t0263 注释）；重试兜底，同时该测试已改为
      # waitFor 断言以消除竞态——重试只是第二道防线，不是唯一防线。
      - name: Unit tests (vitest)
        run: pnpm run test:unit -- --retry=2
      # N12b：失败时把单测原始日志留档，避免再出现「只有摘要、无原始输出」的取证困境
      - name: Upload vitest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-logs
          path: frontend/vitest-report/
          if-no-files-found: ignore
      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_MOCK: "false"
      # ── WD（2026-09-30）：Playwright e2e 门禁 ────────────────────────────────
      # 两套件 base URL 与运行前提互斥（见 frontend/playwright.config.ts 的双口径约定），
      # 故分两步、并各自注明前置。
      #
      # ① mock UI e2e（**阻塞门禁**）：base 3456，产物必须由 `NEXT_PUBLIC_API_MOCK=true`
      #    烘焙——该变量在 build 期内联，运行时改 env 无效。
      #    ⚠️ 这里**不能**用 `pnpm run build`：package.json 的 `prebuild` 钩子在
      #    NEXT_PUBLIC_API_MOCK != "false" 时直接 exit 1（生产防误配守卫，见
      #    frontend/package.json:11）。故走 `pnpm exec next build` 绕过 npm 生命周期钩子，
      #    只产出 e2e 用产物；生产产物仍由上方 `Build` 步骤（MOCK=false）负责。
      # ② 真后端 e2e（**非阻塞**）：需 ① Compose 栈（PG/Redis/LangBot 全起）
      #    ② 主平台 OIDC 白名单已登记 bothot redirect_uri ③ 真实公众号文章 URL
      #    —— 三者 CI 均不具备（见 frontend/e2e/real-backend.spec.ts 头部前置说明）。
      #    故以仓库变量 `E2E_REAL_BACKEND=1` 为闸，且 `continue-on-error: true`：
      #    前置落地后把变量置 1 即自动生效，在此之前既不空转也不阻塞主干。
      #
      # ⚠️ 浏览器必须先装：playwright.config.ts 用 `devices["Desktop Chrome"]`（内置 chromium），
      #    而 `pnpm install` **不**会下载浏览器二进制，缺此步 e2e 必以
      #    "Executable doesn't exist" 失败。`--with-deps` 同时装系统级依赖（runner 有 sudo）。
      - name: Install Playwright browser (chromium)
        run: pnpm exec playwright install --with-deps chromium
      - name: Build (mock artifact, for UI e2e)
        # 必须 rm -rf .next：上方生产 Build 已产出 MOCK=false 产物，而 Next 构建缓存
        # 不按 NEXT_PUBLIC_* 环境变量失效（vercel/next.js 已知陷阱）——直接二次 build
        # 会复用 false 内联，页面照常打 /api/v1 被 rewrite 代理到 :3300，mock e2e 必红
        # （2026-09-30 CI 实证：日志满屏 Failed to proxy localhost:3300）。
        run: rm -rf .next && pnpm exec next build
        env:
          NEXT_PUBLIC_API_MOCK: "true"
      - name: E2E (mock UI)
        run: pnpm run test:e2e
        env:
          PORT: "3456"
      - name: E2E (real backend, non-blocking)
        if: ${{ vars.E2E_REAL_BACKEND == '1' }}
        continue-on-error: true
        run: pnpm run test:e2e -- e2e/real-backend.spec.ts
        env:
          PORT: "3200"
          E2E_REAL_BACKEND: "1"
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose -f docker/compose.yml config --quiet

  # WD（2026-09-30）：compose 冒烟。此前 `compose` job 只做 `config --quiet`（纯语法校验），
  # W5 交付的 `scripts/smoke.sh` **从未被任何 CI 消费**——「整栈能不能真的起来」只靠人工。
  # 本 job 接入它：build backend 镜像 → 起核心服务 → 跑 smoke.sh。
  #
  # CI 适配三处（均为**环境差异**，非功能裁剪）：
  #  1) 只起核心服务、**排除 frontend**：frontend 的 build.args 硬编码宿主代理
  #     `http://host.docker.internal:10808`（docker/compose.yml:342-345）。GitHub runner
  #     上没有该代理，构建必失败；且冒烟只验后端存活与心跳，本就不需要前端。
  #  2) **保留 langbot / langbot_plugin_runtime**：scheduler / worker 的 depends_on 指向
  #     langbot（docker/compose.yml:277 与 :315），缺它两个常驻进程不会启动，
  #     「心跳新鲜度」就无从验起。
  #  3) 生成一次性测试主密钥（32 字节 base64）：`secret_crypto` / `engine_keyring` 在
  #     PUSH_SECRET_MASTER_KEY / ENGINE_KEY_MASTER_KEY 缺失时 fail-closed，
  #     容器内渠道加解密全部拒绝（backend/app/core/secret_crypto.py:31-49）。
  #
  # 判据由 scripts/smoke.sh 定义：`/api/v1/system/health` 信封 code==0
  # + `process_heartbeats` 中 scheduler/worker 心跳 age <= 300s。
  # up 由本 job 显式执行，故 smoke.sh 以 SKIP_UP=1 只做探活（不改其主体逻辑）。
  #
  # ⚠️ 需首次 Actions 运行验证（本地仅能过 `config --quiet` + YAML 解析）：
  #    langbot 镜像拉取耗时、runner 上 3300/5433/6380 端口占用、心跳首次落库时延。
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose -f docker/compose.yml config --quiet
      - name: Generate ephemeral master keys
        run: |
          echo "PUSH_SECRET_MASTER_KEY=$(python3 -c 'import base64,os;print(base64.b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"
          echo "ENGINE_KEY_MASTER_KEY=$(python3 -c 'import base64,os;print(base64.b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"
      - name: Build backend image
        run: docker compose -f docker/compose.yml build backend
      - name: Start core services
        run: |
          docker compose -f docker/compose.yml up -d \
            postgres redis langbot langbot_plugin_runtime migrate backend scheduler worker
          docker compose -f docker/compose.yml ps
      - name: Smoke (health + scheduler/worker heartbeat)
        run: bash scripts/smoke.sh
        env:
          SKIP_UP: "1"
          # 显式非严格：CI 无 LangBot 业务配置，/health 允许 status=degraded；
          # 本 job 只对「HTTP 200 且信封 code==0」+ 心跳新鲜度负责。
          SMOKE_STRICT: "0"
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f docker/compose.yml logs --no-color --tail=200
