name: CI-Windows

# STEP-00W S00W.2.1：windows-dev 从 ci.yml 拆成独立工作流。
# 为什么要拆（不是洁癖，是读数被遮蔽）：windows job 每次卡在全量 pytest 到 timeout-minutes:35 被 cancelled，
# 而同一 run 里 ubuntu 五个 job 每次都 success —— 同居一个工作流时，"CI" 这个对外结论被 Windows 拖成
# cancelled，正式验收面（D-V4-01：CI ubuntu-latest）的真实状态反而看不见。V0.12.0 实测最近 10 次
# CI 全部 cancelled，就是这个形态（证据 docs/任务规划V0.12.0/evidence/3a67e96/workflow_runs_main.json）。
# 拆完之后：`CI` 只反映正式验收面；`CI-Windows` 只反映开发平台门。两者互不遮蔽，各自可红可绿。
# 触发条件与 ci.yml 逐字一致，避免"同一提交两个工作流覆盖不同提交"这种新盲区。

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # ── STEP-00X（V0.11.0 第二增量）：Windows 开发平台门 ─────────────────────────
  # 语义边界（D-V4-01，2026-10-15 签）：**正式验收面是上面的 ubuntu backend/frontend，
  # 本 job 不是**。它只回答一个问题——"Windows 10 作为一等开发平台，装/跑/验这条链
  # 有没有平台性断裂"。所以：
  #   ① ubuntu 的两个 job 一行不改（改了就会动正式验收语义）；
  #   ② 本 job 不起 PG/Redis service，连库用例在本平台**必然全 skip**
  #      ⇒ 本 job 对任何连库结论零主张，也不得被引用成"真库验证过了"；
  #   ③ skip 阈值单独设（SKIP_BASELINE_WIN），否则平台差异会伪装成回归；
  #   ④ 命令实体一律走 scripts/entry.py，与本机 @win 用的是同一份代码——
  #      这条 job 绿只说明"这份入口在 Windows 上成立"，不说明 ubuntu 上换了实现。
  # 读数取证按 D-V6-02：run id + head_sha + conclusion 都要落进日志（末步打印）。
  windows-dev:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      # 测量值，不是猜的。第一次收紧（320→441）之后**同一批我自己把它顶红了**：
      # STEP-23 返工轮新增 2 条连库用例 ⇒ run 39035688934 @2a7195d 读到 `total_skipped=443`
      # 而 baseline 还是 441 ⇒ 门红，且 `failed=0`、未知族=0、构成里 `PG-DSN-未设置` 从 332 变 334。
      # 这就是"零余量"的代价与用途：每张加连库用例的卡都必须**重测**一遍，而不是把红灯当噪声。
      # 读数锚：head_sha=db7e63b、run 39038290651 = `1132 passed / 444 skipped / 0 failed in 983.46s`，
      # 门打的是 `total_skipped=444 baseline=443`、`未知族=0`、`PG-DSN-未设置` 由 334 变 335
      # ⇒ 增量精确等于 STEP-23 第二轮新增的那 1 条端到端连库用例。
      # 前一次同形态：`2a7195d` run 39035688934 = `1125 / 443 / 0`（STEP-23 返工轮 +2 条）。
      # 444 的构成（未知族 = 0）：
      #   PG 类 439 = `AIDEANBOT_TEST_PG_DSN 未设置` 335 + `PG 不可达`/`PG:5433 不可达` 104
      #   非 PG 类 5 = Redis 3 + LangBot :5300 1 + 代理变量 1
      # 交叉核对：同 sha 的 ubuntu job 非 PG 类也是这几族，两侧分母相同（本机 @win 复现过 441 那版）。
      # ⚠️ 不许留余量：余量就是"同数换因"那个洞的宽度（详见 docs/04_engineering/cross-platform.md
      # 的「新增连库用例必做的第二步」）。
      # STEP-24/25（规划方，2026-10-19）新增 8 条连库用例：test_push_task_create_owner 2 +
      # test_push_and_hot_rank_matrix 5（2 + 参数化 3）+ test_channel_update_extra_config_encrypted 1，
      # 均经 db_session 夹具在本平台以「AIDEANBOT_TEST_PG_DSN 未设置」族 skip ⇒ 444 + 8 = 452。
      # 这是按增量推算的值，交付提交的 CI-Windows 读数（total_skipped）回填进 EVD-V14-25 后才算测量值。
      # STEP-21（规划方，2026-10-20）新增 88 条连库用例：test_idor_matrix 87（A 22 + 正控 1 + B 62 + C 2）
      # + test_r11_engine_keys 1，均以「AIDEANBOT_TEST_PG_DSN 未设置」族 skip。
      # **测量值**：1834c4a run 39353354825 = 1324 passed / 540 skipped / 0 failed，构成 PG-DSN-未设置 431 +
      # PG-不可达 104 + Redis 3 + LangBot 1 + 代理变量 1，未知族 0 ⇒ 452 + 88 = 540（推算与测量一致）。
      # STEP-26（执行助手，2026-10-20）新增 5 条连库用例：test_admin_push_persists_notification 2
      # + test_push_persist_order 3，均以「AIDEANBOT_TEST_PG_DSN 未设置」族 skip ⇒ 540 + 5 = 545。
      # 交付提交的 CI-Windows 读数回填 EVD-V14-26 后才算测量值。
      # STEP-31（执行助手，2026-10-20）新增 26 条连库用例（test_audit_log：23 个写操作 + 3 条负面），
      # 本机无 DSN 实测 26 skipped；第 27 条计数锚不连库 ⇒ 545 + 26 = 571。
      # STEP-07（执行助手，2026-10-21）新增 19 条：test_audit_scripts 里 12 条离线判据（脚本装载、
      # 只读静态门、目标门、明文形状与读侧一致性、DSN 串不被 str() 抹口令）不连库，7 条演练用例走
      # conftest 的「AIDEANBOT_TEST_PG_DSN 未设置」族 ⇒ 本机无 DSN 实测 7 skipped ⇒ 571 + 7 = 578。
      # STEP-28（执行助手，2026-10-21）+33：test_system_settings 6 + test_discovery_config 10
      #   + test_category_config 15（参数化按条计）+ test_audit_log 2（STEP-31 那条按写操作参数化的
      #   用例随新写的 admin 端点自己变长 23 → 25，每行都要 db_session）；同一卡第 2 轮再 +1
      #   （后端进程的请求路径必须自己把库值刷进来）⇒ 578 + 33 + 1 = 612。
      # STEP-10 S10.V15.2（执行助手，2026-10-21）+9：test_article_fallback_config 8（该文件另 10 条
      #   不连库：形状校验、AST 接线门、trigger/预算单点驱动都只喂进程内快照）
      #   + test_audit_log 1（仍是那条按写操作参数化的用例，又随新 admin 写端点变长 25 → 26）
      #   ⇒ 612 + 9 = 621。
      # STEP-08（执行助手，2026-10-21）两片 +11：S8.1.1 的 test_source_identifiers 3 条 DB 不变量
      #   （唯一、跨 kind 同值合法、CASCADE）+ S8.2.1 的 test_identifier_resolver 8 条落库判据
      #   （另 6 条不连库：biz/ghid 的推导规则、"没有渠道能做 biz→ghid"的现读断言、AST 接线门）
      #   ⇒ 621 + 3 + 8 = 632。本机无 DSN 按文件实测：3 skipped 与 8 skipped。
      # S8.3 再加 2 条（test_channel_routing 的两条服务层判据：跟着游标翻页 / 旧端口按页号翻，
      #   都要 ArticleManifest 真表）⇒ 632 + 2 = **634**；该文件另 27 条不连库
      #   （端口签名、"没有一家实测到响应游标"的诚实性判据、行级丢弃策略、AST 接线门）。
      #   这里有一处**自我更正**：S8.2.1 提交时我在下面写过一行"S8.3 那批离线判据不需要动阈值"，
      #   那是按"服务层判据可以脱库跑"的假设写的，实测两条都要 db_session ⇒ 假设错，按读数改数。
      # S8.4 再加 3 条（同文件的三条调度器判据：开关关时第二家一次都不调 / 降级开时第二家恰 1 次 /
      #   两家都失败仍如实上抛 ⇒ 要真实 Source + 订阅链，`run_incremental_sync` 会按它们建 Job）
      #   ⇒ 634 + 3 = **637**。该文件现 39 条，无 DSN 单跑实测 `34 passed / 5 skipped`。
      # STEP-09（执行助手，2026-10-22）+4：test_rss_subscription 的 4 条注册落库判据
      #   （feed_url 进标识表 / 同 feed 重复注册幂等 / 未知 type 报错 / feed 地址不许冒充 biz）。
      #   该文件另 11 条不连库：未知标识不发请求、外链过滤与计数、共享白名单、AST 无第二份名单、
      #   计数跨 feed 累计、路由读的那一格与注册写的那一格对得上、10006 永久失败与两条重试边界、
      #   camelCase 请求体 ⇒ 637 + 4 = **641**。本机无 DSN 单跑实测 `11 passed / 4 skipped`。
      #   本卡另改（不改计数）：test_rss_provider 两条既有取路判据的**样本链接**换到白名单域名——
      #   它们原判的是"抓取发生了、行能被消费端接住"与"条数封顶"，与域名名单无关，
      #   换的是喂进去的 feed 内容，断言一条没动。
      # STEP-19（执行助手，2026-10-22）+12：test_r19_notification_paths 8（四条 web 投递入口逐条
      #   数 notifications 行：cron 领取 / 事件 emit+派发 / run-now / test-push / 管理端直投 /
      #   失败极性 / 行载荷同源）+ test_r19_hot_chain 4（聚簇→评分→Feed 回刷→日报降级，
      #   全都要 HotTopic / HotTopicArticle / FeedItem 真表）。
      #   本卡另加 11 条**不连库**：test_r19_ports 7（判 YAML 结构，离线可判）+
      #   test_r19_sso_session 4（真 HTTP + 进程内伪 IdP，会话走 InMemorySessionStore）
      #   ⇒ 641 + 12 = **653**。本机无 DSN 四文件合跑实测 `11 passed / 12 skipped`。
      # **测量值**（收紧依据就地可查，D-V6-02）：上一档 612 的锚是 CI-Windows
      # run 39592643124 @2ab19c2 = 1509 passed / 612 skipped / 0 failed（未知族 0）；
      # 632 的锚 = run 39617514919 @b814938（success：1527 passed / 632 skipped，未知族 0）；
      # 634 的锚 = run 39694539088 @211533c（success，未知族 0）；
      # **637 的锚已到手** = run 39709185171 @b26fef5（success，未知族 0）——
      # STEP-08 收口提交三绿：CI 39709185123 / Security 39709185110 / CI-Windows 39709185171。
      # **本档 641 的锚** = run 39714496408 @22b9ede（success，未知族 0）——STEP-09 交付提交；
      # 同一提交的 Security 39714496311 attempt 1 红在 `pnpm audit` 的 registry socket timeout
      # （scanner 失败被汇总门禁判成 🔴，非漏洞），attempt 2 重跑转绿 ⇒ 登记 P-77。
      # 本档 653 的锚 = run 39722164694 @5f16de9（success，未知族 0）——STEP-19 第 2 轮交付提交；
      # 同一提交 CI 39722164669 / Security 39722164679 均 attempt 1 success（第 1 轮 c9cb215 的
      # Security 🔴 是源码里手编的假 JWT 被 gitleaks `jwt` 规则命中，已按 D-12 登记 + 改现签 ⇒ P-81）。
      SKIP_BASELINE_WIN: "653"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # 与 frontend job 同样的 pnpm 版本解析：packageManager 必须是精确版本，
      # 隐式/范围写法会让 action-setup 静默漂移（见 frontend job N12b 的注释）。
      - name: Resolve pnpm version from packageManager
        id: pnpm
        working-directory: apps/web
        run: |
          pm=$(node -e "console.log(require('./package.json').packageManager || '')")
          case "$pm" in
            pnpm@[0-9]*\.[0-9]*\.[0-9]*)
              echo "version=${pm#pnpm@}" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "❌ packageManager 必须写成 pnpm@<精确版本>，实际：'${pm:-<缺失>}'"
              exit 1 ;;
          esac

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm.outputs.version }}
          run_install: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # 与 backend job 逐字同锚
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Tool fingerprint（Windows 侧实际装到了什么）
        run: |
          echo "os=$RUNNER_OS  python=$(python -V 2>&1)  node=$(node -v)  pnpm=$(pnpm -v)"
          exp_pnpm=${{ steps.pnpm.outputs.version }}
          act_pnpm=$(pnpm -v)
          if [ "$exp_pnpm" != "$act_pnpm" ]; then
            echo "❌ pnpm 漂移：期望 $exp_pnpm 实际 $act_pnpm"; exit 1
          fi
          py_major=$(python -c "import sys;print('%d.%d' % sys.version_info[:2])")
          if [ "$py_major" != "3.12" ]; then
            echo "❌ Python 期望 3.12 实际 $py_major（与 CI ubuntu 侧不同版会让 ruff/mypy 结论不可比）"; exit 1
          fi

      - name: Install backend deps（与 backend job 同口径 .[dev] + pytest-cov）
        working-directory: apps/api
        run: python -m pip install -e ".[dev]" pytest-cov

      - name: Install frontend deps（frozen lockfile）
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      # 平台分支只允许两处（entry.py 的 dispatch() 与 Makefile 的 ifeq），
      # 这里机检"Makefile 的开发类目标在 entry.py 任务表里都存在"，防止两侧名字漂移。
      - name: entry.py 与 Makefile 目标面一致性
        run: python scripts/check_entry_parity.py

      - name: Lint backend（ruff check app tests）
        working-directory: apps/api
        run: python -m ruff check app tests

      - name: Type check backend（mypy app）
        working-directory: apps/api
        run: python -m mypy app

      - name: Backend tests（连库用例在本平台会 skip，只记账不主张）
        working-directory: apps/api
        # STEP-00W S00W.2.2：逐用例超时 + faulthandler 定时转栈。
        # 为什么两个都要：只给 --timeout 时，卡住的用例是"被线程法打断"，拿到的是打断点而不是阻塞点；
        # faulthandler_timeout 到点把**所有线程的原始栈**写进日志，才答得出"卡在哪个调用"。
        # --timeout-method=thread：Windows 上主线程若阻塞在 C 层（connect、DNS），信号法无效。
        # S00H.2.3 收紧 300→120：两次连续 success（run 39500601366 @ b7cdaee、39496625738 @ 376cfe3）的日志里 faulthandler 转栈头=0 ⇒ 没有单用例越过 120s。
        # ⚠️ 收紧后本参数与上面的 faulthandler_timeout=120 **同阈值**，卡死时"先转栈再被杀"不再有保障（见 P-54）。
        run: >-
          python -m pytest tests/ -q --no-header
          -o faulthandler_timeout=120
          --timeout=120 --timeout-method=thread
          --junitxml=pytest-report-win.xml

      - name: Windows skip 门禁（阈值与 ubuntu 分开设定）
        working-directory: apps/api
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          failed = 0
          skips = []
          root = ET.parse("pytest-report-win.xml").getroot()
          for suite in root.iter("testsuite"):
              failed += int(suite.get("failures", 0) or 0) + int(suite.get("errors", 0) or 0)
          for case in root.iter("testcase"):
              s = case.find("skipped")
              if s is not None:
                  skips.append((case.get("classname", ""), (s.get("message") or "")))
          # 已知原因族：本 job 故意不起 PG/Redis/LangBot 服务，所以这几族是**环境**造成的，
          # 不是"用例被无条件标记 skip"。判定顺序=表序，第一条命中即归档；全不命中算未知族。
          # 每族的 token 取自 conftest/用例里的原文，不放宽成正则：放宽就会把新造的假 skip 认成合法。
          FAMILIES = (
              ("PG-DSN-未设置", ("AIDEANBOT_TEST_PG_DSN 未设置",)),
              ("PG-不可达", ("PG 不可达", "PG:5433 不可达")),
              ("Redis-不可达", ("Redis 不可达",)),
              ("LangBot-不可达", ("LangBot :5300 不可达",)),
              ("代理变量未设", ("宿主未设这 6 个待清代理变量",)),
          )


          def family(msg):
              for name, tokens in FAMILIES:
                  if any(t in msg for t in tokens):
                      return name
              return "未知族"


          baseline = int(os.environ.get("SKIP_BASELINE_WIN", "0"))
          buckets = {}
          unknown = []
          for cls, msg in skips:
              f = family(msg)
              buckets[f] = buckets.get(f, 0) + 1
              if f == "未知族" and len(unknown) < 8:
                  unknown.append((cls, msg[:110]))
          print(f"windows 门禁：failed={failed} total_skipped={len(skips)} baseline={baseline}")
          # S00X.4.1 要的就是这行：打印的是**构成**而不是前 12 条样本
          for f, n in sorted(buckets.items(), key=lambda kv: -kv[1]):
              print(f"  族 {f} = {n}")
          if failed:
              print("❌ Windows 上有失败用例——这才是本 job 要抓的（平台性断裂）")
              raise SystemExit(1)
          if unknown:
              print(f"❌ 有 {buckets['未知族']} 条 skip 不属于任何已知环境族——这就是本门要抓的「静默放行」")
              for cls, msg in unknown:
                  print(f"  未知 · {cls} :: {msg}")
              raise SystemExit(1)
          if len(skips) > baseline:
              print(f"❌ skip 数 {len(skips)} 超阈值 {baseline}——新增的连库用例必须显式把阈值抬到测量值，"
                    f"并在 ci-windows.yml 的注释里重算构成（不许留余量：余量就是"
                    f"「同数换因」那个洞的宽度）")
              raise SystemExit(1)
          print("✅ windows 门：无失败；skip 全部落在已知环境族且在阈值内（连库结论仍以 ubuntu job 为准）")
          PY

      - name: Frontend typecheck + unit（vitest）
        working-directory: apps/web
        run: |
          pnpm exec tsc --noEmit
          pnpm run test:unit

      - name: Frontend build（NEXT_PUBLIC_API_MOCK=false 是生产守卫硬要求）
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_MOCK: "false"
        run: pnpm run build

      - name: 取证行（D-V6-02：run id + head_sha + 结论要能被下游引用）
        if: always()
        run: |
          echo "run_id=${GITHUB_RUN_ID}  run_number=${GITHUB_RUN_NUMBER}"
          echo "head_sha=${GITHUB_SHA}  conclusion=${{ job.status }}  job=windows-dev"
