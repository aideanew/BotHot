[project]
name = "bothot-backend"
version = "0.1.0"
description = "BotHot（WeChatRag）：信息源 → 知识库 → 机器人闭环的后端服务"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "psycopg[binary,pool]>=3.2.0",
    "alembic>=1.15.0",
    "redis>=5.2.0",
    "croniter>=0.19",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    # W6 观测：/metrics 暴露面（HTTP/DB/Job/推送/热点指标族）
    "prometheus-client>=0.21.0",
    # SPEC-M3 批次 3 / T5.4：engine_key_registrations 的 AES-256-GCM 落库加密
    "cryptography>=43.0.0",
    # P-106 / D-V18-04：业务日界固定为 Asia/Shanghai，`zoneinfo` 必须取得到时区数据。
    # 此前只有 psycopg 在 win32 上带它（uv.lock 里 marker = sys_platform == 'win32'），
    # Linux 运行镜像靠基础镜像碰巧有 /usr/share/zoneinfo——上游哪天剥掉，后端在 import 期
    # 整体起不来。显式声明、不带平台标记，是本卡唯一真正生效的修法（uv.lock 不被任何运行面消费）。
    "tzdata",
]

[project.optional-dependencies]
# dev 工具链锁精确版本：CI 与本地门禁必须同源，否则上游升版会单方面把 CI 打红。
# 实测 ruff 0.7→0.16.8 漂移后 I001 规则互斥——0.12.12 与 0.16.8 不存在共同可通过
# 的 import 格式（一方的自动修复即为另一方的违规），故只能锁死而非改代码迁就。
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    # STEP-00W S00W.2.2：windows job 需要**逐用例**超时 + 栈转储。没有它，一个卡住的用例
    # 会把整个 job 拖到 timeout-minutes 才被 cancelled——什么栈都留不下（V0.12.0 实测 10 连 cancelled）。
    "pytest-timeout==2.4.0",
    # W6 交付的前置：W10 覆盖率门禁依赖 pytest-cov（本批只装依赖，不改 CI 门禁口径）
    "pytest-cov>=6.0",
    "httpx>=0.27.0",
    "ruff==0.12.12",
    "mypy==2.3.1",
    # STEP-01 S1.3.2 / D-V8-05（签 A）：契约语义的真源交给标准库 Draft 2020-12 validator，
    # 自研比对器退役为"差异登记 + 覆盖率守卫"。锁精确版本，理由同上。
    "jsonschema==4.25.1",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends 习惯

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# STEP-11：性能基线用例默认摘掉（卡面 §5「perf 标记用例，CI 不默认跑」）。
# 为什么用 addopts 的 deselect 而不是用例内的 skip：CI-Windows 的 skip 门禁是**零余量按原因族
# 记账**的，把"默认不跑"做成 skip 会直接多挂几条未知族红在那道门上；deselect 不进任何计数，
# 而 `-m perf` 显式请求时才回来——命令行在 addopts 之后解析，故后者的 -m 覆盖前者（实测）。
addopts = ["-m", "not perf"]
markers = [
    "langbot_real: 连真实 LangBot 冒烟（需 env 凭据 LANGBOT_ADMIN_PASSWORD/EMBEDDING_API_KEY）",
    "perf: 采集性能基线（STEP-11；默认被上面的 addopts 摘掉，跑法见 tests/perf/test_collection_perf.py 文件头）",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
